
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StayEase - Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
        <div class="container">

            <a class="navbar-brand fw-bold brand-color" href="index.html">
                StayEase
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarMenu"
                    aria-controls="navbarMenu"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto gap-lg-3">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="booking.html">Booking</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="register.html">Register</a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <!-- Register Form -->
    <section class="form-section">
        <div class="container">

            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">

                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4 p-md-5">

                            <h2 class="section-title text-center mb-2">
                                Create Account
                            </h2>

                            <p class="text-secondary text-center mb-4">
                                Register to start your journey with StayEase.
                            </p>

                            <form action="#" method="get">

                                <div class="mb-3">
                                    <label for="name" class="form-label">Full Name</label>
                                    <input type="text" class="form-control"
                                           id="name" name="name"
                                           placeholder="Enter your full name" required>
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label">Email Address</label>
                                    <input type="email" class="form-control"
                                           id="email" name="email"
                                           placeholder="Enter your email" required>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" class="form-control"
                                           id="password" name="password"
                                           placeholder="Enter your password" required>
                                </div>

                                <div class="mb-4">
                                    <label for="confirm-password" class="form-label">
                                        Confirm Password
                                    </label>

                                    <input type="password" class="form-control"
                                           id="confirm-password"
                                           name="confirm-password"
                                           placeholder="Confirm your password" required>
                                </div>

                                <button type="submit" class="btn main-btn w-100">
                                    Create Account
                                </button>

                            </form>

                            <p class="text-center mt-4 mb-0">
                                <a href="index.html" class="back-link">Back to Home</a>
                            </p>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <footer class="text-center py-4">
        <div class="container">
            <p class="mb-0">&copy; 2026 StayEase. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
